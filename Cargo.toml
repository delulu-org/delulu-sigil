[package]
name = "delulu-sigil"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Delulu Core Team"]
description = "Delulu's official publisher tool for DAD local addons: hash platform binaries, fill manifest, and ed25519-sign the canonical payload."

[[bin]]
name = "delulu-sigil"
path = "src/main.rs"

[dependencies]
dad-local-core = { git = "https://github.com/delulu-org/dad-sdk-local", tag = "v0.2.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ed25519-dalek = { version = "2", features = ["zeroize"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
getrandom = "0.2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Memory"] }
